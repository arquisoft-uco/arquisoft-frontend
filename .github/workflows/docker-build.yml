# ==============================================================================
# Arquisoft Frontend — Docker Build & Push
# ==============================================================================
# Construye imagen Docker multi-arquitectura (amd64 + arm64) y la publica en
# GitHub Container Registry (GHCR). Se dispara solo cuando "CI Frontend"
# termina en éxito sobre main. El deploy a Oracle Cloud vive en un workflow
# separado (deploy.yml) que se encadena vía workflow_run sobre este.
# Runner: GitHub-hosted (ubuntu-latest) — gratis
# ==============================================================================

name: Docker Build & Push

on:
  workflow_run:
    workflows: ['CI Frontend']
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write

    steps:
      # ── Checkout (el commit real que pasó CI, no el HEAD del workflow) ──
      - name: Checkout código
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ── SHA corto (tag inmutable) ──
      - name: Calcular short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # ── Variables VITE_* de build (un solo secreto con formato .env) ──
      - name: Escribir .env.production.local desde el secreto
        run: printf '%s\n' "${{ secrets.VITE_ENV_FILE }}" > .env.production.local

      # ── Login GHCR ──
      - name: Login a GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── QEMU (necesario para emitir el manifest arm64; la etapa builder del
      #     Dockerfile fuerza --platform=$BUILDPLATFORM así que NO compila
      #     bajo emulación, solo la etapa runtime nginx la usa) ──
      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      # ── Setup Buildx ──
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build & Push multi-arch ──
      - name: Build y push imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
